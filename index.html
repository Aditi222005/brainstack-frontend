<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Providing multiple sizes allows modern browsers and Apple devices to display the icon larger and crisper -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- TODO: Set the document title to the name of your application -->
  <title>BrainStack</title>
  <meta name="description" content="Your Intelligent Knowledge Base" />
  <meta name="author" content="BrainStack" />

  <!-- TODO: Update og:title to match your application name -->
  <meta property="og:title" content="BrainStack" />
  <meta property="og:description" content="Your Intelligent Knowledge Base" />
  <meta property="og:type" content="website" />
  <!-- OpenGraph images don't use 'sizes', we just give them the path to the high-res image -->
  <meta property="og:image" content="/favicon.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@BrainStack" />
  <meta name="twitter:image" content="/favicon.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
